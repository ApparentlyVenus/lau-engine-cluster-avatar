<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patient Session</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e3e1db;
    --learner: #2457a6; --patient: #8a3b2e; --tag: #9a8f7a; --ok: #2f7d4f; --warn: #b7791f; --bad: #b0322a;
    --bar: #ece9e2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --panel: #1e1e1c; --ink: #ecebe7; --muted: #9b9a95; --line: #33322f;
      --learner: #7aa7ec; --patient: #e39a8b; --tag: #8f877a; --ok: #5cbf86; --warn: #e0a84a; --bad: #e66b62;
      --bar: #2b2a27;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px;
           border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .who { color: var(--muted); }
  .spacer { flex: 1; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .dot.live { background: var(--ok); }
  .dot.speaking { background: var(--patient); }
  button { font: inherit; padding: 7px 16px; border-radius: 6px; border: 1px solid var(--line);
           background: var(--ink); color: var(--bg); cursor: pointer; }
  button.stop { background: var(--bad); border-color: var(--bad); color: #fff; }
  label { color: var(--muted); font-size: 13px; display: flex; gap: 6px; align-items: center; }
  .meter { width: 70px; height: 6px; background: var(--bar); border-radius: 3px; overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; background: var(--learner); transition: width .08s; }
  main { display: grid; grid-template-columns: 1fr 300px; gap: 16px; padding: 16px 20px; max-width: 1180px; margin: 0 auto; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  #log { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px;
         min-height: 60vh; max-height: calc(100vh - 120px); overflow-y: auto; }
  .turn { margin: 0 0 14px; }
  .who-l { color: var(--learner); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .who-p { color: var(--patient); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .partial { color: var(--muted); font-style: italic; }
  .pause { display: inline-block; font-size: 11px; padding: 0 5px; margin: 0 2px; border-radius: 4px;
           background: var(--bar); color: var(--muted); font-family: ui-monospace, monospace; }
  .tag { color: var(--tag); font-family: ui-monospace, monospace; font-size: 12px; }
  .timing { color: var(--muted); font-size: 12px; margin-top: 2px; white-space: pre-line; }
  .note { color: var(--muted); font-size: 12px; }
  .cut { color: var(--bad); font-size: 12px; }
  aside { display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  .row { display: flex; justify-content: space-between; font-size: 14px; margin: 6px 0 3px; }
  .row b { font-weight: 600; }
  .bar { height: 7px; background: var(--bar); border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; transition: width .4s; }
  #trustbar i { background: var(--ok); } #satbar i { background: var(--warn); }
  .emotion { font-size: 20px; font-weight: 600; margin: 2px 0; }
  .chips span { display: inline-block; font-size: 12px; padding: 2px 8px; margin: 2px 4px 2px 0;
                border-radius: 10px; background: var(--bar); }
  .lat { font-family: ui-monospace, monospace; font-size: 13px; }
  .empty { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>Patient session</h1>
  <span class="who" id="who"></span>
  <span class="spacer"></span>
  <label>mic <span class="meter"><i id="level"></i></span></label>
  <label><input type="checkbox" id="barge"> barge-in</label>
  <button id="go">Start</button>
</header>

<main>
  <section id="log"><p class="empty">Press Start, allow the microphone, and speak as the doctor. Headphones recommended.</p></section>
  <aside>
    <div class="card">
      <h2>Her state</h2>
      <div class="emotion" id="emotion">–</div>
      <div class="note" id="undertone"></div>
      <div class="row"><span>Trust</span><b id="trust">–</b></div>
      <div class="bar" id="trustbar"><i></i></div>
      <div class="row"><span>Saturation</span><b id="sat">–</b></div>
      <div class="bar" id="satbar"><i></i></div>
      <div class="row"><span>Defense</span><b id="defense">–</b></div>
      <div class="row"><span>Unacknowledged turns</span><b id="unack">–</b></div>
    </div>
    <div class="card">
      <h2>Last turn scored</h2>
      <div class="chips" id="flags"><span class="empty">none yet</span></div>
    </div>
    <div class="card">
      <h2>Last turn latency</h2>
      <div class="lat" id="lat"><span class="empty">none yet</span></div>
    </div>
  </aside>
</main>

<script>
const IN_RATE = 16000, OUT_RATE = 24000;
const $ = (id) => document.getElementById(id);
let ws, micCtx, micStream, playCtx, nextTime = 0, sources = [], liveP = null, partialEl = null, lastLearner = null;

fetch("/config").then(r => r.json()).then(c => {
  $("who").textContent = `${c.patient}, ${c.age}`;
  $("barge").checked = c.barge_in;
});

// ---- conversation log -----------------------------------------------------
function esc(s) { return s.replace(/[&<>]/g, ch => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[ch])); }
function fmtLearner(s) { return esc(s).replace(/\[pause ([\d.]+)s\]/g, '<span class="pause">pause $1s</span>'); }
function fmtPatient(s) { return esc(s).replace(/\[([^\]]+)\]/g, '<span class="tag">[$1]</span>'); }
function addTurn(html) {
  const log = $("log");
  if (log.querySelector(".empty")) log.innerHTML = "";
  const div = document.createElement("div");
  div.className = "turn"; div.innerHTML = html;
  log.appendChild(div); log.scrollTop = log.scrollHeight;
  return div;
}

function onEvent(ev) {
  switch (ev.type) {
    case "learner_partial":
      if (!partialEl) partialEl = addTurn('<div class="who-l">Doctor</div><div class="partial"></div>');
      partialEl.querySelector(".partial").textContent = ev.text;
      $("log").scrollTop = $("log").scrollHeight;
      break;
    case "learner_final": {
      const el = partialEl || addTurn("");
      partialEl = null;
      el.innerHTML = '<div class="who-l">Doctor</div><div>' + fmtLearner(ev.annotated || ev.text) + "</div>" +
        (ev.timing ? '<div class="timing">' + esc(ev.timing) + "</div>" : "");
      lastLearner = el;
      break;
    }
    case "turn_reopened": {
      // The doctor was only pausing: drop the half turn (and any reply to it);
      // it comes back merged with what follows.
      if (lastLearner) {
        while (lastLearner.nextSibling) lastLearner.nextSibling.remove();
        lastLearner.remove();
        lastLearner = null;
      }
      liveP = null;
      break;
    }
    case "patient_interjects":
      addTurn('<div class="who-p">Patient (interrupts)</div><div>' + fmtPatient(ev.text) + "</div>");
      break;
    case "patient_chunk":
      if (!liveP) liveP = addTurn('<div class="who-p">Patient</div><div class="txt"></div>');
      liveP.querySelector(".txt").innerHTML += (liveP.querySelector(".txt").innerHTML ? " " : "") + fmtPatient(ev.text);
      $("log").scrollTop = $("log").scrollHeight;
      break;
    case "patient_done":
      if (liveP && ev.note) liveP.insertAdjacentHTML("beforeend", '<div class="note">' + esc(ev.note) + "</div>");
      liveP = null;
      break;
    case "network":
      addTurn('<div class="cut">Slow connection: your words reached the transcriber ' + ev.stt_lag_s +
              's after you stopped (normally ~0.5s). Turn-taking will feel off until it recovers.</div>');
      break;
    case "out_of_character":
      addTurn('<div class="cut">The model broke character here; a fallback line was spoken instead. Logged.</div>');
      break;
    case "cut_off":
      if (liveP) liveP.insertAdjacentHTML("beforeend", '<div class="cut">cut off by the doctor</div>');
      liveP = null;
      break;
    case "state": showState(ev); break;
    case "latency": showLatency(ev); break;
    case "clear": stopPlayback(); break;
  }
}

function showState(s) {
  $("emotion").textContent = s.emotion;
  $("undertone").textContent = `undertone ${s.undertone} · intensity ${s.intensity}`;
  $("trust").textContent = `${s.trust} ${s.trust_band}`;
  $("sat").textContent = `${s.saturation} ${s.saturation_band}`;
  $("trustbar").firstElementChild.style.width = (s.trust * 100) + "%";
  $("satbar").firstElementChild.style.width = (s.saturation * 100) + "%";
  $("defense").textContent = s.defense;
  $("unack").textContent = s.unacknowledged;
  const flags = Object.entries(s.flags || {});
  if (s.flags) $("flags").innerHTML = flags.length
    ? flags.map(([k, v]) => `<span>${k} ${(+v).toFixed(2)}</span>`).join("") + (s.escalated ? "<span>escalated</span>" : "")
    : '<span class="empty">no behaviours flagged</span>';
}

function showLatency(l) {
  const rows = [["turn end", l.final], ["interpreter", l.interp_done], ["first chunk", l.first_chunk], ["first audio", l.first_audio]]
    .filter(([, v]) => v !== undefined).map(([k, v]) => `${k.padEnd(12, " ")} ${v.toFixed(2)}s`);
  $("lat").innerHTML = rows.length ? "<pre style='margin:0'>" + rows.join("\n") + "</pre>" : '<span class="empty">–</span>';
}

// ---- her voice ------------------------------------------------------------
function play(buf) {
  const pcm = new Int16Array(buf);
  if (!pcm.length) return;
  const f = new Float32Array(pcm.length);
  for (let i = 0; i < pcm.length; i++) f[i] = pcm[i] / 32768;
  const ab = playCtx.createBuffer(1, f.length, OUT_RATE);
  ab.copyToChannel(f, 0);
  const src = playCtx.createBufferSource();
  src.buffer = ab; src.connect(playCtx.destination);
  const start = Math.max(playCtx.currentTime + 0.03, nextTime);
  src.start(start); nextTime = start + ab.duration;
  sources.push(src);
  $("dot").className = "dot speaking";
  src.onended = () => {
    sources = sources.filter(s => s !== src);
    if (!sources.length) $("dot").className = ws ? "dot live" : "dot";
  };
}
function stopPlayback() {
  sources.forEach(s => { try { s.stop(); } catch (e) {} });
  sources = []; nextTime = 0;
  $("dot").className = ws ? "dot live" : "dot";
}

// ---- mic ------------------------------------------------------------------
const WORKLET = `
class Capture extends AudioWorkletProcessor {
  constructor() { super(); this.ratio = sampleRate / ${IN_RATE}; this.pos = 0; this.sum = 0; this.n = 0;
                  this.out = []; this.lvl = 0; this.frames = 0; }
  process(inputs) {
    const ch = inputs[0][0];
    if (!ch) return true;
    for (let i = 0; i < ch.length; i++) {
      // box-filter downsample to 16 kHz
      this.sum += ch[i]; this.n++; this.pos += 1;
      if (this.pos >= this.ratio) { this.pos -= this.ratio; this.out.push(this.sum / this.n); this.sum = 0; this.n = 0; }
      this.lvl = Math.max(this.lvl * 0.9995, Math.abs(ch[i]));
    }
    if (this.out.length >= 320) {             // 20 ms chunks
      const pcm = new Int16Array(this.out.length);
      for (let i = 0; i < this.out.length; i++) pcm[i] = Math.max(-1, Math.min(1, this.out[i])) * 32767;
      this.out = [];
      this.port.postMessage(pcm.buffer, [pcm.buffer]);
    }
    if (++this.frames % 8 === 0) this.port.postMessage({ level: this.lvl });
    return true;
  }
}
registerProcessor("capture", Capture);`;

async function start() {
  playCtx = new AudioContext({ sampleRate: OUT_RATE });
  micStream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 },
  });
  micCtx = new AudioContext();
  await micCtx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: "application/javascript" })));
  const node = new AudioWorkletNode(micCtx, "capture");
  micCtx.createMediaStreamSource(micStream).connect(node);

  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws?barge_in=${$("barge").checked ? 1 : 0}`);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => { $("dot").className = "dot live"; };
  ws.onmessage = (m) => typeof m.data === "string" ? onEvent(JSON.parse(m.data)) : play(m.data);
  ws.onclose = () => { stop(); };
  node.port.onmessage = (e) => {
    if (e.data.level !== undefined) { $("level").style.width = Math.min(100, e.data.level * 250) + "%"; return; }
    if (ws && ws.readyState === 1) ws.send(e.data);
  };
  $("go").textContent = "End"; $("go").className = "stop"; $("barge").disabled = true;
}

function stop() {
  if (ws) { const w = ws; ws = null; try { w.close(); } catch (e) {} }
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  if (micCtx) micCtx.close();
  stopPlayback();
  micStream = micCtx = null;
  $("go").textContent = "Start"; $("go").className = ""; $("barge").disabled = false;
  $("dot").className = "dot"; $("level").style.width = "0";
}

$("go").onclick = () => (ws ? stop() : start().catch(e => { alert("Could not start: " + e.message); stop(); }));
</script>
</body>
</html>
