<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patient Simulator</title>
<style>
  :root { --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e3e1db; --bad: #b0322a; --field: #fbfaf8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --panel: #1e1e1c; --ink: #ecebe7; --muted: #9b9a95; --line: #33322f; --bad: #e66b62; --field: #252523; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
         background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  form { width: 100%; max-width: 340px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 26px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  input { width: 100%; font: inherit; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  button { width: 100%; margin-top: 20px; font: inherit; padding: 9px; border-radius: 6px; border: 0; background: var(--ink); color: var(--bg); cursor: pointer; }
  .err { color: var(--bad); font-size: 13px; margin-top: 12px; min-height: 1em; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>Patient simulator</h1>
  <p>Sign in to continue.</p>
  <label for="u">Username</label>
  <input id="u" name="username" autocomplete="username" required autofocus>
  <label for="p">Password</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">Sign in</button>
  <div class="err"><!--ERROR--></div>
</form>
</body>
</html>
